# Application name used by Spring Boot for logging and service identification.
spring.application.name=smart-task-backend

# Server port used to run the backend API locally.
server.port=${SERVER_PORT:8080}

# MySQL database connection URL. Override DB_HOST, DB_PORT, and DB_NAME per environment.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_task_db}

# MySQL database username. Override DB_USERNAME outside local development.
spring.datasource.username=${DB_USERNAME:root}

# MySQL database password. Override DB_PASSWORD outside local development.
spring.datasource.password=${DB_PASSWORD:password}

# MySQL JDBC driver used by Spring Data JPA.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Enables Hibernate-backed JPA repository support.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Controls schema generation. Use validate/update locally, and prefer migrations in production.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Shows generated SQL statements in application logs during development.
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Formats generated SQL statements for easier reading.
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# Includes SQL comments generated by Hibernate for debugging query origins.
spring.jpa.properties.hibernate.use_sql_comments=${HIBERNATE_SQL_COMMENTS:true}

# Logs SQL statements generated by Hibernate.
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:DEBUG}

# Logs bound SQL parameter values for Hibernate 6.
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:TRACE}
